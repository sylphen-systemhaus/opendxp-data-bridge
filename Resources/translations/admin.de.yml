pim.dataport.opendxp.fields.data_query_selector.hint: Mit <code>Feldname</code> oder <code>{{ Feldname }}</code> können Sie auf andere Felder zugreifen.<br>Diese Data Query Selektoren können auch verkettet werden, z.B. <code>ManyToOneRelation:FieldOfRelatedObject</code>.<br>Für Logikoperationen kann <a href="https://twig.symfony.com/doc/3.x/templates.html" target="_blank">Twig-Syntax</a> verwendet werden, z.B.<br><code>{{ Feld1 * Feld2 }}</code><br><br>oder<br><br><code>{% if Feld1 != '' %}<br>&nbsp;&nbsp;{{ Feld1 }}<br>{% else %}<br>&nbsp;&nbsp;{{ Feld2 }}<br>{% endif %}</code><br><br>Alternativ kann auch PHP-Code verwendet werden, z.B.<br><code>return strlen({{ description }});</code><br><br>or<br><br><code>foreach({{ relationalField:each:(validFrom;price) }} as $price) {<br>&nbsp;&nbsp;if($price['validFrom'] > time()) {<br>&nbsp;&nbsp;&nbsp;&nbsp;return $price['price'];<br>&nbsp;&nbsp;}<br>}</code><br><br>Data Query Selectors stammen aus Blackbit Data Director (Syntax unverändert). Siehe <a href="https://www.youtube.com/watch?v=mAu_5Eg3q_o&list=PL4-QRNfdsdKIfzQIP-c9hRruXf0r48fjt&index=9&t=1954s&pp=iAQB" target="_blank">YouTube-Tutorial</a> und <a href="https://blackbitdigitalcommerce.github.io/pimcore-data-director/#data-query-selectors" target="_blank">Blackbit Data Director Handbuch</a>.
