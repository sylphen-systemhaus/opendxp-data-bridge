pim.mapping.variables.env: Environment variables
pim.mapping.variables.value: Value of mapped raw data field as imported from import resource
pim.mapping.variables.rawItemData: Values of all raw data fields of current raw data item
pim.mapping.variables.rawItemData.single: Value of raw data field "%s"
pim.mapping.variables.currentValue: Current value of field %s in object which got found via set key fields, <i>not available in object querying phase</i>
pim.mapping.variables.currentObjectData: Array with all current values from the found OpenDXP element (associative array with element's field names as keys), <i>not available in object querying phase</i>
pim.mapping.variables.currentObjectData.single: Current value in field "%s"
pim.mapping.variables.keyValues: Associative array with key values indexed by key field names, <i>not available in object querying phase</i>
pim.mapping.variables.response: Current HTTP response document generated by this callback function from previously processed raw items, initially empty <code>Response</code> object - via <code>$params['response']->addContent('my response content');</code> you can append data to it. Alternatively, you can populate the response via <code>$params['response']->setContent('my response content');</code> or <code>return "my response content";</code> but this is less performant.<br>Response HTTP headers can be set via <code>$params['response']->headers->set('Header Name', 'Header value');</code>.
pim.mapping.variables.request: Current Request object - access URL parameters of REST API requests via <code>$params['request']->get('parameterName')</code>. <br>Access current language via <code>$params['request']->getLocale()</code>.
pim.mapping.variables.context: Context of the current processing
pim.mapping.variables.logs: Logs for events which happened during processing of current raw item
pim.mapping.variables.objectIDs: Array with the IDs of the elements which got changed by the current raw data item
pim.mapping.variables.lastCall: <i>true</i> if the current raw data item is the last one for this import / export, else <i>false</i>
pim.mapping.variables.transfer: Object for storing data to be reused / processed on later raw item datasets, the object is initially empty
pim.mapping.variables.translator: Object to access OpenDXP translations, e.g. <code>$params['translator']->translate('Translation Key');</code> or <br><code>$params['translator']->translate('Translation Key', 'en');</code><br>Works with admin and shared translations.
pim.mapping.variables.response.action: Response document which got created by result callback function
pim.mapping.variables.transfer.action: Transfer object which eventually got filled by the result callback function
pim.mapping.variables.logger: PSR-3 Logger object, e.g. for debugging <code>$params['logger']->info($myVariable);</code>
