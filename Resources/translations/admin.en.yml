pim.dataport.opendxp.fields.data_query_selector.hint: Access other fields via <code>Fieldname</code> or <code>{{ Fieldname }}</code>.<br>You can chain data query selectors, e.g. <code>ManyToOneRelation:FieldOfRelatedObject</code>.<br>For logic operations, you can use <a href="https://twig.symfony.com/doc/3.x/templates.html" target="_blank">Twig syntax</a>, e.g.<br><code>{{ Field1 * Field2 }}</code><br><br>or<br><br><code>{% if Field1 != '' %}<br>&nbsp;&nbsp;{{ Field1 }}<br>{% else %}<br>&nbsp;&nbsp;{{ Field2 }}<br>{% endif %}</code><br><br>Alternatively, you can use PHP code, for example<br><code>return strlen({{ description }});</code><br><br>or<br><br><code>foreach({{ relationalField:each:(validFrom;price) }} as $price) {<br>&nbsp;&nbsp;if($price['validFrom'] > time()) {<br>&nbsp;&nbsp;&nbsp;&nbsp;return $price['price'];<br>&nbsp;&nbsp;}<br>}</code><br><br>Data Query Selectors originate from Blackbit Data Director (syntax unchanged). See the <a href="https://www.youtube.com/watch?v=mAu_5Eg3q_o&list=PL4-QRNfdsdKIfzQIP-c9hRruXf0r48fjt&index=9&t=1954s&pp=iAQB" target="_blank">YouTube tutorial</a> and the <a href="https://blackbitdigitalcommerce.github.io/pimcore-data-director/#data-query-selectors" target="_blank">Blackbit Data Director handbook</a>.
