# Isolated OpenDXP demo for Sylphen Data Bridge development.
services:
  redis:
    image: redis:alpine
    command: [ redis-server, --maxmemory, 128mb, --maxmemory-policy, volatile-lru, --save, '""' ]
    container_name: opendxp-dd-redis

  db:
    image: mariadb:10.11
    container_name: opendxp-dd-db
    working_dir: /application
    command: [ mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --innodb-file-per-table=1 ]
    environment:
      - MYSQL_ROOT_PASSWORD=ROOT
      - MYSQL_DATABASE=opendxp
      - MYSQL_USER=opendxp
      - MYSQL_PASSWORD=opendxp
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysql -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1'" ]
      interval: 10s
      retries: 6
      start_period: 30s
      timeout: 3s

  nginx:
    image: nginx:stable-alpine
    container_name: opendxp-dd-nginx
    ports:
      - "2000:80"
    depends_on:
      php:
        condition: service_started
    volumes:
      - .:/opendxp-data-bridge:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app:/var/www/opendxp

  php:
    build: .
    container_name: opendxp-dd-php
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/opendxp-data-bridge
      - app:/var/www/opendxp
      - ~/.composer:/tmp/composer:delegated
      - ~/.ssh:/var/www/.ssh:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      - COMPOSER_HOME=/tmp/composer
      - PHP_IDE_CONFIG=serverName=localhost
      - COMPOSER_MEMORY_LIMIT=-1
      - OPENDXP_INSTALL_ADMIN_USERNAME=admin
      - OPENDXP_INSTALL_ADMIN_PASSWORD=admin
      - OPENDXP_INSTALL_MYSQL_USERNAME=opendxp
      - OPENDXP_INSTALL_MYSQL_PASSWORD=opendxp
      - OPENDXP_INSTALL_MYSQL_HOST_SOCKET=db
      - OPENDXP_INSTALL_MYSQL_DATABASE=opendxp
      - SYMFONY_ASSETS_INSTALL=symlink
      - XDEBUG_CONFIG=client_host=host.docker.internal

volumes:
  app:
  dbdata:
